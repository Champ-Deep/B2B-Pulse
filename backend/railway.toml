[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.prod"

# Web service default. Celery worker and celery-beat are deployed as separate
# Railway services from the same backend/ directory — override the Start
# Command in each of those services (see docs/SETUP.md).
[deploy]
startCommand = "alembic upgrade head && gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 4 --access-logfile - --error-logfile -"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
