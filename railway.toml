# Root railway.toml — used when no Root Directory is set on the Railway service.
# This configures the backend (web) service.
# Celery worker, beat, and the frontend are separate Railway services;
# see docs/SETUP.md for their start commands and root directory settings.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "railway-start"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
