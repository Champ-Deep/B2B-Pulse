# B2B Pulse — backend stack for a self-hosted VPS.
#
# This is the "backend on our own secure VPS, frontend on a static host" shape.
# It deliberately does NOT include the frontend: the SPA is a pile of static
# files that belongs on a CDN, and keeping it out means a frontend deploy can
# never restart the workers that are mid-way through an account's day.
#
# Differences from docker-compose.prod.yml, which this replaces for VPS use:
#
#   * **Postgres is here.** prod.yml had none — every service pointed at a
#     DATABASE_URL host that did not exist in the file. A deploy from it came
#     up with no database.
#   * **Migrations run as a gated one-shot.** Nothing that touches the schema
#     starts until `alembic upgrade head` has exited 0. Previously nothing ran
#     migrations at all, so a fresh VPS had empty tables and a new revision
#     landed as a runtime error.
#   * **Only Caddy is exposed.** Postgres, Redis and the API bind to the
#     compose network, not to the host. An open 5432 on a public VPS is found
#     by scanners within hours.
#
# Usage:
#   cp .env.vps.example .env
#   $EDITOR .env                       # see docs/DEPLOYMENT.md for each value
#   docker compose -f docker-compose.vps.yml up -d --build
#   docker compose -f docker-compose.vps.yml logs -f migrate

x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile.prod
  restart: unless-stopped
  env_file: [.env]
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    migrate: {condition: service_completed_successfully}

services:
  # ---------------------------------------------------------------------
  # Data
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No host port. The only thing that needs Postgres is on this network, and
    # a public 5432 is found by scanners within hours. Reach it with
    # `docker compose exec postgres psql`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: {cpus: "1", memory: 1G}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly matters here beyond durability-in-general: the rate limiter's
    # sliding windows live in Redis. Losing them on a restart would hand every
    # account a fresh daily and weekly allowance, which is the one failure mode
    # the caps exist to prevent.
    command: >
      redis-server --appendonly yes --appendfsync everysec
      --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 640M}

  # ---------------------------------------------------------------------
  # Schema
  # ---------------------------------------------------------------------
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    command: alembic upgrade head

  # ---------------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------------
  api:
    <<: *backend
    # Also no host port: Caddy is the only way in, so TLS cannot be bypassed
    # by hitting the box on :8000.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits: {cpus: "2", memory: 2G}

  worker:
    <<: *backend
    # --concurrency is the number of actions that can be in flight at once.
    # It is not a throughput dial: the per-account caps bound real volume, and
    # raising this only makes the limiter refuse more often. Four is plenty for
    # five accounts.
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - playwright_data:/home/appuser/.cache/ms-playwright
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --timeout 10"]
      interval: 60s
      timeout: 15s
      start_period: 45s
      retries: 3
    deploy:
      resources:
        limits: {cpus: "2", memory: 2G}

  beat:
    <<: *backend
    # Exactly one beat container, ever. Two would double every scheduled task —
    # including the warm-up runner, which would then plan and execute each
    # account's day twice. Do not scale this service.
    command: >
      celery -A app.workers.celery_app beat --loglevel=info
      --pidfile=/tmp/celerybeat.pid --schedule=/tmp/celerybeat-schedule
    deploy:
      replicas: 1
      resources:
        limits: {cpus: "0.5", memory: 512M}

  # ---------------------------------------------------------------------
  # Edge
  # ---------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN, e.g. api.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # holds the issued certificates — must persist
      - caddy_config:/config
    depends_on:
      api: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}

volumes:
  postgres_data:
  redis_data:
  playwright_data:
  caddy_data:
  caddy_config:
